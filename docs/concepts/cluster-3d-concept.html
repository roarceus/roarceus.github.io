<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sohan Cluster 3D Concept</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* One fixed screen: top bar, scene + detail panel, terminal. Nothing scrolls on desktop; long content pages. */
:root{
  --bg:#0a0e14;--surface:#111823;--surface-2:#162030;--line:#243145;--line-2:#33435c;
  --text:#e7edf5;--muted:#97a5b8;--accent:#3d7bff;--accent-soft:#8fb3ff;
  --ok:#3fb950;--warn:#e3a12f;--bad:#f2554b;--done:#9aabc3;--cfg:#2fbf8f;--sec:#a594f9;--gold:#d9b85c;
  --font-sans:"Inter",system-ui,sans-serif;--font-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--font-sans);overflow:hidden;
  display:grid;grid-template-rows:auto minmax(0,1fr) auto;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent-soft);outline-offset:2px}
.muted{color:var(--muted)}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);min-width:0}
.brand{display:flex;align-items:center;gap:8px;font:500 15px var(--font-mono);white-space:nowrap}
.hexmark{width:20px;height:20px;color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font:500 12px var(--font-mono);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.ok{background:#11301c;color:#7fe29d}.pill.bad{background:#3a1414;color:#ff9a92}
.who{display:flex;align-items:baseline;gap:10px;min-width:0;overflow:hidden;white-space:nowrap}
.who b{font:600 16px var(--font-sans)}
.spacer{flex:1}
.btn{border:1px solid var(--line-2);background:transparent;border-radius:8px;padding:6px 12px;cursor:pointer;white-space:nowrap;font-size:13px;min-height:36px;text-decoration:none;display:inline-flex;align-items:center}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#2f6aea}
.concept{font:500 11px var(--font-mono);color:var(--warn);border:1px dashed #6b5016;border-radius:6px;padding:2px 8px;white-space:nowrap}
main{display:grid;grid-template-columns:minmax(0,1fr) 360px;min-height:0}
#stage{position:relative;min-height:0;background:#0d121a;overflow:hidden}
#stage canvas{display:block;width:100%;height:100%;cursor:grab}
.tag{position:absolute;pointer-events:none;transform:translate(-50%,-100%);font:500 11px var(--font-mono);white-space:nowrap;padding:3px 8px;border-radius:6px;background:rgba(10,14,20,.85);border:1px solid var(--line-2)}
.tag.comp{color:var(--accent-soft);border-color:#22365c}
.tag.node{font-size:12px}
.tag.cordon{color:var(--muted);border-style:dashed}
.tag.cfg{color:var(--cfg);border-color:#1d5a45}.tag.sec{color:var(--sec);border-color:#3f3a7a}.tag.svc{color:var(--accent-soft)}.tag.evt{color:var(--muted)}
.tag.cert,.tag.award{color:var(--gold);border-color:#5b4c22;font-size:10px}
#flabel{position:absolute;pointer-events:none;transform:translate(-50%,calc(-100% - 10px));padding:6px 10px;border-radius:8px;background:var(--surface-2);border:1px solid var(--accent);font:12px var(--font-mono);white-space:nowrap;transition:opacity .2s}
#flabel::after{content:"";position:absolute;left:50%;bottom:-6px;width:10px;height:10px;background:var(--surface-2);border-right:1px solid var(--accent);border-bottom:1px solid var(--accent);transform:translateX(-50%) rotate(45deg)}
#crumbs{position:absolute;left:14px;top:12px;font:12px var(--font-mono);color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#crumbs button{background:none;border:0;padding:2px 0;color:var(--accent-soft);cursor:pointer;text-decoration:underline;text-underline-offset:3px;font:inherit}
#crumbs b{color:var(--text);font-weight:500}
#filter{position:absolute;left:14px;top:38px;font:12px var(--font-mono);color:var(--cfg)}
#legend{position:absolute;left:14px;bottom:12px;display:flex;gap:12px;font:11px var(--font-mono);color:var(--muted);pointer-events:none;flex-wrap:wrap}
#legend span::before{content:"";display:inline-block;width:9px;height:9px;margin-right:5px;border-radius:2px;background:var(--c);vertical-align:-1px}
#skip{position:absolute;right:14px;bottom:12px;font:11px var(--font-mono)}
#dive{position:absolute;right:14px;top:12px;font:12px var(--font-mono)}
aside{border-left:1px solid var(--line);background:var(--surface);display:grid;grid-template-rows:minmax(0,1fr) auto;min-height:0}
.page{padding:16px 18px;overflow:hidden;min-height:0;display:flex;flex-direction:column;gap:10px}
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border-top:1px solid var(--line);font:12px var(--font-mono);color:var(--muted)}
.pager .btn{padding:4px 10px;min-height:32px;font-size:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font:12px var(--font-mono);margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.title{font:600 19px/1.3 var(--font-sans);text-wrap:balance;margin:0}
.eyebrow{font:12px var(--font-mono);color:var(--muted)}
.prose{margin:0;color:var(--muted);font-size:13.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:11px var(--font-mono);padding:2px 8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line);cursor:pointer;color:var(--text)}
.chip:hover{border-color:var(--cfg);color:var(--cfg)}
.row{display:flex;justify-content:space-between;gap:10px;font:12px var(--font-mono);align-items:baseline}
.row button{background:none;border:0;padding:0;color:var(--accent-soft);cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-align:left;font:inherit}
.bar{display:grid;grid-template-columns:110px 1fr 28px;gap:8px;align-items:center;font:12px var(--font-mono)}
.bar i{display:block;height:8px;border-radius:2px;background:linear-gradient(90deg,var(--accent) var(--w),#1b2536 var(--w))}
.yaml{font:12px/1.65 var(--font-mono);white-space:pre-wrap;margin:0;color:var(--text)}
.yaml .k{color:var(--accent-soft)}.yaml .c{color:var(--muted)}
.decoded{border-left:2px solid var(--sec);padding-left:10px}
.st-Completed{color:var(--done)}.st-Running{color:var(--ok)}.st-CrashLoopBackOff,.st-Terminating{color:var(--bad)}.st-ContainerCreating,.st-Pending{color:var(--warn)}
form.manifest{font:12px/1.9 var(--font-mono);display:flex;flex-direction:column}
form.manifest input{min-width:0;background:var(--bg);border:1px solid var(--line-2);border-radius:6px;padding:4px 8px;font:12px var(--font-mono)}
#term{border-top:1px solid var(--line);background:var(--surface);padding:10px 16px 12px;display:grid;gap:8px}
#out{height:120px;overflow:hidden;font:12.5px/1.6 var(--font-mono);white-space:pre}
#out .cmd{color:var(--muted)}#out .ok{color:var(--ok)}#out .bad{color:var(--bad)}#out .warn{color:var(--warn)}#out .more{color:var(--accent-soft)}
.prompt{display:flex;gap:8px;align-items:center;font-family:var(--font-mono)}
.prompt span{color:var(--accent-soft)}
#cmd{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;font:14px var(--font-mono)}
.chipbar{display:flex;gap:6px;flex-wrap:wrap}
.cbtn{border:1px solid var(--line-2);background:transparent;border-radius:8px;padding:4px 10px;cursor:pointer;display:grid;text-align:left;min-height:40px}
.cbtn:hover{background:var(--surface-2)}
.cbtn b{font:500 12.5px var(--font-sans)}.cbtn small{font:10.5px var(--font-mono);color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:900px){
  body{overflow:auto;height:auto;display:block}
  main{grid-template-columns:1fr}
  #stage{height:58vh}
  aside{border-left:0;border-top:1px solid var(--line);min-height:420px}
  .who span{display:none}
}
@media (max-width:560px){.who,.concept{display:none}}
</style>

<header>
  <div class="brand"><svg class="hexmark" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l8.66 5v10L12 22l-8.66-5V7z" fill="none" stroke="currentColor" stroke-width="2"/></svg>sohan-cluster</div>
  <span id="health" class="pill ok">All pods healthy</span>
  <span style="font:12px var(--font-mono)" class="muted">v1.3.0</span>
  <div class="who"><b>Sohan Patil</b><span class="muted">Software Engineer (DevOps, Cloud, Full Stack)</span></div>
  <div class="spacer"></div>
  <span class="concept">concept, not final UI</span>
  <button class="btn" type="button" data-run="config use-context plain">Plain view</button>
  <button class="btn primary" type="button" data-run="apply -f contact.yaml">Contact</button>
</header>

<main>
  <section id="stage" aria-label="Cluster map. Everything here is also reachable from the chips and the terminal.">
    <nav id="crumbs" aria-label="Where you are"></nav>
    <div id="filter"></div>
    <button id="dive" class="btn" type="button" hidden>Step inside</button>
    <div id="legend"><span style="--c:var(--done)">Completed</span><span style="--c:var(--ok)">Running</span><span style="--c:var(--warn)">Creating</span><span style="--c:var(--bad)">Failing</span><span style="--c:var(--gold)">Award, cert</span><span style="--c:#7aa7ff">request</span></div>
    <button id="skip" class="btn" type="button">Skip boot</button>
    <div id="flabel" style="opacity:0"></div>
  </section>
  <aside aria-label="Details">
    <div class="page" id="panel"></div>
    <div class="pager" id="ppager" hidden><button class="btn" type="button" id="pprev">Previous</button><span id="pnum">1 / 1</span><button class="btn" type="button" id="pnext">Next</button></div>
  </aside>
</main>

<section id="term" aria-label="Terminal">
  <div id="out" role="log" aria-live="polite"></div>
  <form class="prompt" id="pform" autocomplete="off"><span aria-hidden="true">$</span><label class="sr" for="cmd">Command</label><input id="cmd" spellcheck="false" placeholder="kubectl exec -it asktrace -- sh"></form>
  <div class="chipbar" id="chips"></div>
</section>

<script>
const D = {"projects": {"ai-migration-agents": {"name": "AI migration agent framework", "tagline": "LangGraph and Claude Code agents that migrated about 55 Java services and got 100+ PRs merged.", "status": "completed", "node": "mastercontrol", "tech": ["LangGraph", "Claude Code", "Java", "Gradle", "GitHub", "Slack"], "links": {}, "start": "2025-06", "end": "2025-12", "story": ["The platform team wanted about 55 Java/Gradle services on their standard Gradle plugins (base Java setup, static analysis, and Sonar). By hand that meant a lot of near-identical PRs, so I built agents to do it.", "Over three rollouts it made 100 to 150 repo changes and got over 100 PRs merged, from about 350 agent sessions in 63 repos. People only reviewed PRs that were already green. It's internal to MasterControl, so the code isn't public."], "bullets": ["LangGraph runs a fixed, auditable workflow for each repo: clone it, check whether it needs the update,", "Claude Code makes the actual edits inside each repo.", "I wrote the prompts (a manager agent plus subagents, 17 to 50 KB each) and revised them about 20", "I also wrote scripts to promote passing PRs and track rollout status for the handoff."]}, "analog-clock": {"name": "Analog Clock", "tagline": "Vanilla JS analog clock with light and dark modes.", "status": "completed", "node": "mumbai", "tech": ["JavaScript", "HTML", "CSS"], "links": {"repo": "https://github.com/roarceus/analog-clock"}, "start": "", "end": "", "story": ["An analog clock in vanilla JavaScript, with light and dark modes and a background that changes with the time of day."], "bullets": []}, "asktrace": {"name": "askTRACE", "tagline": "Pulls insights out of Northeastern's course evaluation surveys with Kafka, GKE, and RAG.", "status": "completed", "node": "northeastern", "tech": ["Go", "Python", "Kafka", "Kubernetes", "Helm", "GKE", "GCP", "Terraform", "Jenkins", "RAG"], "links": {"repo": "https://github.com/trace-survey-analysis", "demo": "https://www.youtube.com/watch?v=VntctukuTwA"}, "start": "2025-01", "end": "2025-04", "story": ["askTRACE processes Northeastern's TRACE (Teacher Rating And Course Evaluation) survey data and answers questions about it using retrieval-augmented generation (RAG).", "We were a team of two for CSYE 7125, and I worked on almost all of the 13 repos:"], "bullets": ["Go and Python services talking over Kafka, running on Google Kubernetes Engine.", "GCP infrastructure in Terraform.", "Helm charts for the services, plus a Kubernetes operator for backups.", "Jenkins CI for the whole system."]}, "aws-iaas": {"name": "AWS infrastructure for a web app", "tagline": "A Node.js app on AWS with all of its infrastructure in Terraform and email verification in a serverless function.", "status": "completed", "node": "northeastern", "tech": ["Terraform", "AWS", "Node.js", "GitHub Actions"], "links": {"repo": "https://github.com/user-profile-terraform-iac"}, "start": "2024-09", "end": "2024-12", "story": ["I built this on my own for CSYE 6225 (Network Structures and Cloud Computing) at Northeastern. It's three repos:", "CI/CD runs on GitHub Actions."], "bullets": ["`tf-aws-infra`: the AWS infrastructure, all in Terraform.", "`webapp`: a Node.js back end for user profiles.", "`serverless`: a serverless function that verifies new users by email."]}, "book-review-system": {"name": "Book Review System", "tagline": "Python web app to find, rate, and review books, with Goodreads integration.", "status": "completed", "node": null, "tech": ["Python", "MySQL", "Heroku"], "links": {"repo": "https://github.com/roarceus/book-reviews-system-cloud-computing"}, "start": "", "end": "", "story": ["A book review web app built with Python: find books, rate them, and write reviews. It used the Goodreads API for cross-platform ratings and reviews."], "bullets": []}, "credit-management-system": {"name": "Credit Management System", "tagline": "CRUD app that simulates a credit management system.", "status": "completed", "node": "sparks-foundation", "tech": ["PHP", "MySQL", "CSS"], "links": {"repo": "https://github.com/roarceus/php-credit-management"}, "start": "2020-08", "end": "2020-09", "story": ["A CRUD application that simulates a credit management system, built with PHP and MySQL during my web development internship at The Sparks Foundation."], "bullets": []}, "deployment-gating-bot": {"name": "Deployment gating bot", "tagline": "A GitHub App that pauses merges or deployments across 60+ GitOps repos with one switch per repo.", "status": "completed", "node": "mastercontrol", "tech": ["TypeScript", "Probot", "GitHub Apps", "Kubernetes", "Helm", "Argo CD", "Vitest", "cosign"], "links": {}, "start": "2025-06", "end": "2025-12", "story": ["Release managers needed a way to freeze merges to main before a release, or stop dev deployments during an incident. Before this, that meant editing workflows or branch protection in every repo. This GitHub App gives them one switch per repo for two gates, merges to main and dev deployments, across 60+ GitOps-deployed repos.", "How it works:"], "bullets": ["Written in TypeScript on Probot. It hooks into GitHub deployment protection rules and the Checks API.", "Gate state lives in repo custom properties, so there's no database. The bot is stateless, so restarts", "It fails open. If the bot is down, teams can still ship.", "Runs on Kubernetes from a Helm chart deployed by Argo CD."]}, "google-maps-clone": {"name": "Maps Clone", "tagline": "Front-end map app built on the Mapbox API.", "status": "completed", "node": "mumbai", "tech": ["JavaScript", "HTML", "Mapbox"], "links": {"repo": "https://github.com/roarceus/google-maps-clone"}, "start": "", "end": "", "story": ["A simple front-end map application, modeled on Google Maps, built with the Mapbox API."], "bullets": []}, "huskyhub": {"name": "HuskyHub", "tagline": "Java Swing app supporting student housing and well-being.", "status": "completed", "node": "northeastern", "tech": ["Java", "Java Swing", "DB4O"], "links": {"repo": "https://github.com/roarceus/HuskyHub"}, "start": "2024-01", "end": "2024-04", "story": ["A Java Swing application backed by DB4O, built as a collaborative system that supports students' well-being at a university and helps them find housing."], "bullets": []}, "kounsellor": {"name": "Kounsellor", "tagline": "Counselling website with user management.", "status": "completed", "node": "mumbai", "tech": ["PHP", "HTML", "CSS"], "links": {"repo": "https://github.com/roarceus/kounsellor-counselling-website"}, "start": "", "end": "", "story": ["A counselling website built with PHP, with a user management system."], "bullets": []}, "meeting-notes-react": {"name": "Meeting Notes (React)", "tagline": "MERN app to create and browse meeting notes.", "status": "completed", "node": null, "tech": ["TypeScript", "React", "Node.js", "Express.js", "MongoDB"], "links": {"repo": "https://github.com/roarceus/meeting-notes-react"}, "start": "", "end": "", "story": ["A dynamic meeting notes app on the MERN stack with TypeScript: create new notes or browse existing ones."], "bullets": []}, "meeting-notes": {"name": "Meeting Notes", "tagline": "Static meeting notes app.", "status": "completed", "node": "mumbai", "tech": ["JavaScript", "Sass", "HTML"], "links": {"repo": "https://github.com/roarceus/meeting-notes"}, "start": "", "end": "", "story": ["A static meeting notes app: create new notes or view existing ones."], "bullets": []}, "neu-grade-calculator": {"name": "Grade Calculator", "tagline": "JavaFX app for engineering students to track and analyze their grades.", "status": "completed", "node": "northeastern", "tech": ["Java", "JavaFX", "SQLite"], "links": {"repo": "https://github.com/roarceus/NEUGradeCalculator"}, "start": "2025-01", "end": "2025-04", "story": ["A JavaFX application for Northeastern University College of Engineering students to track, calculate, and analyze their academic performance."], "bullets": []}, "oct-data-api": {"name": "OCT data API", "tagline": "No   if (verb === 'get' && a === 'achievements') { request(); selected = null; paintScene(); setPanel(panels.awards()); goHome(); D.achievements.forEach((x, i) => { const n = ORG_NODE[x.org]; if (n && nodeObjs[n]) setTimeout(() => pulse(nodeObjs[n].group.position), i * 350); }); return print([cmd, ...table(['NAME', 'ORG', 'DATE'], D.achievements.map((x) => [x.id, x.org, x.date]))]); }
  if (verb === 'describe' && a === 'achievement') { const x = D.achievements.find((y) => y.id === b); if (x) { const n = ORG_NODE[x.org]; n && nodeObjs[n] ? await select('node', n, panels.award(b)) : setPanel(panels.award(b)); if (n && nodeObjs[n]) pulse(nodeObjs[n].group.position); return print([cmd, [`${x.title}, ${x.org}, ${ym(x.date)}`, '']]); } }
  if ((verb === 'logs' && a === 'updates') || (verb === 'get' && a === 'events')) { request(); selected = null; paintScene(); setPanel(panels.updates()); goHome();
    const ups = D.updates.slice().sort((x, y) => (y.date > x.date ? 1 : -1));
    ups.forEach((u, i) => setTimeout(() => { const n = UPDATE_NODE(u.title); pulse(n ? nodeObjs[n].group.position : new THREE.Vector3(0, 0, 0), n ? C.gold : C.packet); }, i * 300));
    return print([cmd, ...ups.map((u) => [`${u.date}  ${u.title}`, ''])]); }
  if (verb === 'describe' && a === 'node' && nodeObjs[b]) { await request(NODES[b].cordoned ? [] : [P.kubelet(b)]); await select('node', b, panels.node(b)); return print([cmd, [`Name: ${b}   Labels: ${NODES[b].label}   Pods: ${nodeObjs[b].slots.length}${NODES[b].cordoned ? '   Taints: SchedulingDisabled' : ''}`, '']]); }

  if (verb === 'apply' && /contact/.test(line)) { request(); selected = null; paintScene(); setPanel(panels.contact()); return print([cmd, ['opened contact.yaml in the panel', '']]); }
  if (verb === 'delete' && a === 'pod' && podObjs[b]) {
    const p = podObjs[b]; if (!p.node || NODES[p.node].cordoned) return print([cmd, ['error: only pods on Ready nodes can be recreated here', 'bad']]);
    print([cmd, [`pod "${b}" deleted`, 'warn'], ['controller-manager: replicaset wants 1, has 0', 'cmd']]); select('pod', b, panels.pod(p.clone || b)); setStatus(b, 'Terminating'); p.target = 0.05;
    await request(); await send([P.api(), P.ctrl(), P.api()]); await send([P.api(), P.sched(), P.api()]); await send([P.api(), P.kubelet(p.node)]);
    p.target = 1; setStatus(b, 'ContainerCreating'); await wait(900); setStatus(b, 'Running'); setPanel(panels.pod(p.clone || b));
    return print([cmd, [`pod "${b}" deleted`, 'warn'], [`${b}   Terminating > ContainerCreating > Running`, 'ok'], ['the controller recreated it: self-healing', 'cmd']]); }
  if (verb === 'chaos') { const live = Object.keys(podObjs).filter((n) => podObjs[n].node && !NODES[podObjs[n].node].cordoned && podObjs[n].status !== 'CrashLoopBackOff'); const v = pick(live); setStatus(v, 'CrashLoopBackOff'); await select('pod', v, panels.pod(podObjs[v].clone || v)); return print([cmd, [`chaos: ${v} is in CrashLoopBackOff`, 'bad'], [`hint: kubectl rollout restart deploy/${v}`, 'warn']]); }
  if (verb === 'rollout' && a === 'restart') { const n = (b || '').replace('deploy/', ''); const p = podObjs[n]; if (!p || !p.node) return print([cmd, [`Error from server (NotFound): deployments.apps "${n}" not found`, 'bad']]);
    print([cmd, [`deployment.apps/${n} restarted`, 'ok']]); select('pod', n, panels.pod(p.clone || n)); p.target = 0.05; setStatus(n, 'Terminating');
    await request(); await send([P.api(), P.ctrl(), P.api(), P.sched(), P.api(), P.kubelet(p.node)]); p.target = 1; setStatus(n, 'ContainerCreating'); await wait(800); setStatus(n, 'Running'); setPanel(panels.pod(p.clone || n));

  const words = ['get nodes', 'get pods', 'top skills', 'exec -it asktrace -- sh', 'logs updates', 'help'];
  return print([cmd, [`error: unknown command "${parts.join(' ')}"`, 'bad'], [`Did you mean this? kubectl ${words.find((w) => w.startsWith(verb)) || 'help'}`, 'warn']]);
}

/* ---------- chips, keys, picking ---------- */
const CHIPS = [['About', 'cluster-info'], ['Experience', 'get nodes'], ['Projects', 'get pods -n projects'], ['Skills', 'top skills'], ['Certifications', 'get certificates'], ['Achievements', 'get achievements'], ['Updates', 'logs updates'], ['Step inside a pod', 'exec -it asktrace -- sh'], ['Break something', 'chaos start'], ['Self-heal', 'delete pod safehaven']];
$('#chips').innerHTML = CHIPS.map(([l, c]) => `<button class="cbtn" type="button" data-run="${c}"><b>${l}</b><small>kubectl ${c}</small></button>`).join('');
document.querySelectorAll('[data-run]').forEach((b) => b.onclick = () => run(b.dataset.run, true));
$('#dive').onclick = () => selected && run(`exec -it ${selected.name} -- sh`, true);
$('#pform').onsubmit = (e) => { e.preventDefault(); const v = $('#cmd').value; $('#cmd').value = ''; run(v); };
$('#cmd').addEventListener('keydown', (e) => { if (e.key === 'ArrowUp') { e.preventDefault(); hix = Math.max(0, hix - 1); $('#cmd').value = hist[hix] || ''; } if (e.key === 'ArrowDown') { e.preventDefault(); hix = Math.min(hist.length, hix + 1); $('#cmd').value = hist[hix] || ''; } });
document.addEventListener('keydown', (e) => {
  if (e.key === ' ' && document.activeElement !== $('#cmd') && tpages.length > 1) { e.preventDefault(); tix = (tix + 1) % tpages.length; showT(); }
  if (e.key === 'Escape') { if (level === 'pod') { run('exit'); return; } if (filter) { filter = null; paintScene(); return; } selected = null; paintScene(); setPanel(panels.home()); goHome(); }
});
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(); let downAt = null, hover = null, lastClick = 0;
const toNDC = (e) => { const r = renderer.domElement.getBoundingClientRect(); mouse.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1); };
const hitAt = (e) => { toNDC(e); ray.setFromCamera(mouse, camera); return ray.intersectObjects(level === 'pod' ? podPick : clusterPick)[0]; };
renderer.domElement.addEventListener('pointerdown', (e) => { downAt = [e.clientX, e.clientY]; skipBoot(); });
renderer.domElement.addEventListener('pointermove', (e) => { const h = hitAt(e); hover = h ? h.object : null; renderer.domElement.style.cursor = hover ? 'pointer' : 'grab'; });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 5) return; const hit = hitAt(e); if (!hit) return;
  const { kind, name } = hit.object.userData; const now = performance.now(); const dbl = now - lastClick < 350 && selected?.name === name; lastClick = now;
  if (kind === 'res') { const map = { container: `describe pod ${inside}`, configmap: 'get configmap', secret: 'get secret', service: 'describe svc', events: 'get events' }; run(map[name]); return; }
  if (kind === 'pod' && dbl && !podObjs[name].clone) { run(`exec -it ${name} -- sh`); return; }
  run({ node: `describe node ${name}`, pod: `describe pod ${name}`, component: `describe pod ${name}`, cert: `describe certificate ${name}`, award: `describe achievement ${name}` }[kind]);
});

/* ---------- boot ---------- */
function skipBoot() { if (!booting) return; booting = false; bootT = 99; $('#skip')?.remove(); }
$('#skip').onclick = skipBoot;
async function boot() {
  setPanel(panels.home()); crumbs();
  if (!booting) { $('#skip')?.remove(); print([['$ kubectl cluster-info', 'cmd'], ['Kubernetes control plane is running', 'ok'], ['Try a chip below, or double-click a pod to step inside it', '']]); return; }
  const lines = []; const steps = [['control-plane', 'Ready'], ['node/capgemini', 'Ready'], ['node/mastercontrol', 'Ready'], ['node/northeastern', 'Ready'], ['node/mumbai', 'Ready,SchedulingDisabled'], [`pods`, `${Object.keys(D.projects).length} scheduled`], ['cluster sohan-cluster', 'Ready']];
  for (const [n, s] of steps) { if (!booting) return; lines.push([`${n.padEnd(24)}${s}`, s.startsWith('Ready') ? 'ok' : '']); print([['$ kubectl get nodes --watch', 'cmd'], ...lines.slice(-5)]); await wait(400); }
  booting = false; $('#skip')?.remove(); print([['$ kubectl cluster-info', 'cmd'], ['Kubernetes control plane is running', 'ok'], ['Try a chip below, or double-click a pod to step inside it', '']]);
}

/* ---------- loop ---------- */
function resize() { const r = stage.getBoundingClientRect(); renderer.setSize(r.width, r.height, false); camera.aspect = r.width / Math.max(1, r.height); camera.updateProjectionMatrix(); }
addEventListener('resize', () => { resize(); const blocks = pages.flat(); if (blocks.length) setPanel(blocks); });
const v = new THREE.Vector3();
function place(el, world, show = true) { if (!show) { el.style.visibility = 'hidden'; return; } v.copy(world).project(camera); const r = stage.getBoundingClientRect(); el.style.left = ((v.x + 1) / 2) * r.width + 'px'; el.style.top = ((1 - v.y) / 2) * r.height + 'px'; el.style.visibility = v.z > 1 ? 'hidden' : 'visible'; }
let last = performance.now(), visible = true; document.addEventListener('visibilitychange', () => { visible = !document.hidden; });
const ease = (x) => 1 - Math.pow(1 - x, 3);
function frame(now) {
  requestAnimationFrame(frame); if (!visible) return; const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (bootT < 4) bootT += dt * (booting ? 1 : 8);
  const rise = (d) => Math.max(0.001, ease(Math.min(1, Math.max(0, (bootT - d) * 1.6))));
  cp.scale.setScalar(rise(0)); Object.values(compObjs).forEach((o, i) => o.mesh.scale.setScalar(rise(0.3 + i * 0.1)));
  Object.values(nodeObjs).forEach((o, i) => o.group.scale.setScalar(rise(0.6 + i * 0.22)));
  for (const [n, p] of Object.entries(podObjs)) {
    p.scale += (p.target - p.scale) * Math.min(1, dt * 6); p.mesh.scale.setScalar(Math.max(0.001, p.scale * p.size * rise(1.4 + (n.length % 7) * 0.08)));
    const sel = selected?.kind === 'pod' && selected.name === n; const match = filter && p.proj?.tech.some((t) => t.toLowerCase() === filter.toLowerCase());
    p.mesh.position.y = p.base + (sel ? 0.5 : 0) + (hover === p.mesh ? 0.2 : 0) + (match && !reduce ? 0.35 + Math.sin(now / 300 + p.base) * 0.1 : 0) + (p.pending && !reduce ? Math.sin(now / 600 + p.mesh.position.x) * 0.15 : 0);
    p.mesh.rotation.z = p.status === 'CrashLoopBackOff' && !reduce ? Math.sin(now / 90) * 0.12 : 0;
  }
  if (!reduce) compObjs['kube-scheduler'].mesh.rotation.y += dt * 0.8;
  for (let i = packets.length - 1; i >= 0; i--) { const k = packets[i]; k.t += dt / k.hop; const seg = Math.floor(k.t); if (seg >= k.curves.length) { clusterG.remove(k.m); packets.splice(i, 1); k.done(); continue; } k.m.position.copy(k.curves[seg].getPoint(k.t - seg)); }
  for (let i = pulses.length - 1; i >= 0; i--) { const k = pulses[i]; k.t += dt; k.m.scale.setScalar(1 + k.t * 6); k.m.material.opacity = Math.max(0, 1 - k.t / 1.2); if (k.t > 1.2) { clusterG.remove(k.m); pulses.splice(i, 1); } }

  if (glide) { glide.t = Math.min(1, glide.t + (dt * 1000) / glide.ms); const e = ease(glide.t); camera.position.lerpVectors(glide.fromP, glide.toP, e); controls.target.lerpVectors(glide.fromT, glide.toT, e); if (glide.t >= 1) { const d = glide.done; glide = null; d && d(); } }
  controls.update();
  for (const t of tags) place(t.el, t.world, t.level === level);
  if (level === 'cluster' && selected?.kind === 'pod' && podObjs[selected.name]) place(flabel, podObjs[selected.name].mesh.position.clone().setY(podObjs[selected.name].mesh.position.y + 0.7));
  renderer.render(scene, camera);
}
resize(); updateHealth(); requestAnimationFrame(frame); boot();
})();
