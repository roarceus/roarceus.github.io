name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Shown on the page and by `kubectl version`; the PR head commit for PRs.
  PUBLIC_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unused code (knip)
        run: pnpm knip
      - name: Dependency rules (dependency-cruiser)
        run: pnpm depcruise
      - name: Unit tests with coverage
        run: pnpm test:coverage
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            jq -r '.total | "## Coverage\n\n| Metric | % |\n|---|---|\n| Lines | \(.lines.pct) |\n| Branches | \(.branches.pct) |\n| Functions | \(.functions.pct) |\n| Statements | \(.statements.pct) |"' \
              coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Build
        run: pnpm build

      - name: Build with the dashboard flag (design doc §4.8; never set for releases)
        env:
          # fixtures: test-only pages for the e2e CSP checks (ADR 0004).
          PUBLIC_ENABLED_FLAGS: clusterDashboard,fixtures
        run: pnpm exec astro build --outDir dist-dashboard

      - name: Check the CSP of every built page (ADR 0004)
        run: node .github/scripts/check-csp.mjs dist dist-dashboard

      - name: Check the terminal data file size (stage-3 design §5.1, under 30 KB gzipped)
        run: |
          file=$(ls dist-dashboard/cluster.*.json)
          size=$(gzip -9 -c "$file" | wc -c)
          echo "Terminal data file: $(basename "$file"), ${size} bytes gzipped (limit 30720)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$size" -gt 30720 ]; then echo "::error::$file is over the 30 KB gzipped budget"; exit 1; fi
          if ls dist/cluster.*.json >/dev/null 2>&1; then echo "::error::the production build must not ship cluster.*.json"; exit 1; fi

      - name: Build under a preview base path and check every reference and the CSP
        env:
          BASE_PATH: /pr-preview/pr-0/
        run: |
          # Once as production ships, once with the dashboard flag as previews ship.
          for flags in "" clusterDashboard,fixtures; do
            PUBLIC_ENABLED_FLAGS="$flags" pnpm exec astro build --outDir dist-base-check
            node .github/scripts/check-csp.mjs dist-base-check
            bad=$(grep -rhoE '(href|src|action)="/[^"]*"|url\(/[^)]*\)' dist-base-check --include='*.html' --include='*.css' \
              | grep -v '/pr-preview/pr-0/' || true)
            if [ -n "$bad" ]; then
              echo "::error::References outside the base path (flags: '$flags'):"; echo "$bad"; exit 1
            fi
          done

      - name: Upload site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          include-hidden-files: true # keep .nojekyll
          retention-days: 7
      - name: Upload dashboard build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-dashboard
          path: dist-dashboard/
          include-hidden-files: true
          retention-days: 7

  e2e:
    name: e2e (${{ matrix.engine }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Install ${{ matrix.engine }}
        run: pnpm exec playwright install --with-deps ${{ matrix.engine }}
      - name: Playwright + axe
        # The production build; the dashboard specs run in e2e-dashboard.
        run: pnpm exec playwright test tests/e2e --project="${{ matrix.engine }}-*" --grep-invert @dashboard

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.engine }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # The cluster dashboard shell, built with its flag on (design doc §4.8).
  e2e-dashboard:
    name: e2e dashboard (${{ matrix.engine }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-dashboard
          path: dist/

      - name: Install ${{ matrix.engine }}
        run: pnpm exec playwright install --with-deps ${{ matrix.engine }}
      - name: Playwright + axe (dashboard)
        run: pnpm exec playwright test tests/e2e --project="${{ matrix.engine }}-*" --grep @dashboard

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-dashboard-${{ matrix.engine }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  lighthouse:
    name: lighthouse
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Lighthouse CI (mobile budgets)
        run: pnpm lhci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-dashboard
          path: dist-dashboard/
      - name: Lighthouse CI on the dashboard build (/)
        run: pnpm exec lhci autorun --collect.staticDistDir=./dist-dashboard --collect.url=http://localhost/index.html
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse
          path: .lighthouseci/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: ignore

  links:
    name: links
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Check internal links (offline)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config lychee.toml --offline --root-dir ${{ github.workspace }}/dist --no-progress 'dist/**/*.html'
          fail: true

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write # summary comment on failure
    steps:
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # Permissive licenses (SPEC §10b). MPL-2.0 is file-level copyleft used by build and test
          # tooling (lightningcss via Tailwind, axe-core); OFL-1.1 covers the self-hosted fonts.
          allow-licenses: >-
            MIT, ISC, Apache-2.0, BSD-2-Clause, BSD-3-Clause, 0BSD, BlueOak-1.0.0, CC0-1.0,
            CC-BY-4.0, Unlicense, Python-2.0, PSF-2.0, OFL-1.1, MPL-2.0
          # Exceptions, CI-only and never shipped: the Sentry CLI (FSL-1.1-Apache-2.0, source-available,
          # becomes Apache-2.0 after two years) comes with Lighthouse via @sentry/node.
          allow-dependencies-licenses: pkg:npm/sentry

  # The single required status check. Matrix or job renames never break the ruleset.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [quality, build, e2e, e2e-dashboard, lighthouse, links, dependency-review]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: All jobs passed or were skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")' > /dev/null
