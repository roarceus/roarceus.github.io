name: Scorecard

# OpenSSF Scorecard: supply-chain security checks, results in the Security tab and the README
# badge (SPEC §10 workflow 6, decision D3). Kept to the steps Scorecard allows when publishing.

on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: '30 7 * * 2' # Tuesdays 07:30 UTC

permissions: {}

# No concurrency group or env here: publish_results only accepts a minimal workflow shape, and
# runs are short and idempotent anyway.

jobs:
  analysis:
    name: analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      security-events: write # upload SARIF to code scanning
      id-token: write # publish results for the badge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0 (v2.6.0 image is missing on ghcr.io)
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload results artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard
          path: results.sarif
          retention-days: 7

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
