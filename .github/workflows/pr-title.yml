name: PR title

# The PR title becomes the squash commit on main (and the changelog entry), so it must pass the
# same Conventional Commit rules as commitlint. Types and scopes come from the same file.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/commit-convention.json
          sparse-checkout-cone-mode: false

      - name: Read types and scopes
        id: convention
        run: |
          {
            echo 'types<<EOF'; jq -r '.types[]' .github/commit-convention.json; echo 'EOF'
            echo 'scopes<<EOF'; jq -r '.scopes[]' .github/commit-convention.json; echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Conventional Commit format
        uses: amannn/action-semantic-pull-request@c5e23b7e584519ee15caa684cf60d056aa9f035f # v6.1.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: ${{ steps.convention.outputs.types }}
          scopes: ${{ steps.convention.outputs.scopes }}
          requireScope: true
          # Same as commitlint's config-conventional subject-case: don't start with an uppercase letter.
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: The subject "{subject}" must start with a lowercase letter.

      - name: Header length (max 72, like commitlint)
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          length=${#TITLE}
          if [ "$length" -gt 72 ]; then
            echo "::error::PR title is $length characters; the limit is 72."
            exit 1
          fi

  label:
    name: label
    # Fork PRs get a read-only token; labels are a convenience, not a gate.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Type label from the title
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TITLE: ${{ github.event.pull_request.title }}
        with:
          script: |
            const match = /^(\w+)(?:\([^)]*\))?!?:/.exec(process.env.TITLE ?? '');
            if (!match) return core.info('Title is not a Conventional Commit; skipping type label.');
            const wanted = `type: ${match[1]}`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const current = context.payload.pull_request.labels.map((l) => l.name);
            for (const name of current.filter((n) => n.startsWith('type: ') && n !== wanted)) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number, name });
            }
            if (!current.includes(wanted)) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: [wanted] });
            }

      - name: Area labels from changed paths
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          configuration-path: .github/labeler.yml
          sync-labels: false
