name: Preview

# Deploys each PR to https://roarceus.github.io/pr-preview/pr-<N>/ on the gh-pages branch, comments
# the URL, smoke-tests it, and removes it when the PR closes (SPEC §2, §10 workflow 3).

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions: {}

# One run per PR at a time; never cancel mid-push to gh-pages. Production deploys use a different
# group, and both deploy with force: false, so concurrent pushes rebase and retry instead of
# overwriting each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    # Fork PRs get a read-only token and must not publish to this site.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push to gh-pages
      pull-requests: write # sticky preview comment
    outputs:
      action: ${{ steps.preview.outputs.deployment-action }}
      url: ${{ steps.preview.outputs.preview-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: github.event.action != 'closed'
        uses: ./.github/actions/setup
      - name: Build for the preview path
        if: github.event.action != 'closed'
        env:
          BASE_PATH: /pr-preview/pr-${{ github.event.pull_request.number }}/
          PUBLIC_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          # Previews show unfinished work behind its flag; releases never set this (design doc §4.8).
          PUBLIC_ENABLED_FLAGS: clusterDashboard
        run: pnpm build

      - name: Deploy or remove preview
        id: preview
        uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976 # v1.8.2
        with:
          source-dir: dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto

  smoke:
    name: smoke
    needs: deploy
    if: needs.deploy.outputs.action == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Smoke test the live preview
        env:
          SMOKE_BASE_URL: ${{ needs.deploy.outputs.url }}
          SMOKE_EXPECT_COMMIT: ${{ github.event.pull_request.head.sha }}
          SMOKE_EXPECT_DASHBOARD: 'true'
        run: |
          # Normalize to a trailing slash; the action's URL may omit it.
          export SMOKE_BASE_URL="${SMOKE_BASE_URL%/}/"
          pnpm test:smoke
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-preview
          path: test-results/smoke/
          retention-days: 7
          if-no-files-found: ignore
